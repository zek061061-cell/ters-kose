name: riskbudur targeted probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/riskbudur-targeted-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract public data flow
        shell: bash
        run: |
          curl -L --compressed --connect-timeout 10 --max-time 35 -A 'Mozilla/5.0' -sS https://www.riskbuduranaliz.com/ -o /tmp/risk.html
          python - <<'PY'
          import re
          s=open('/tmp/risk.html',encoding='utf-8',errors='replace').read()
          terms=[
            'const FIREBASE_CONFIG','var FIREBASE_CONFIG','FIREBASE_CONFIG =',
            'function bultenTarihMaclariniAc','bultenTarihMaclariniAc =',
            'BULTEN_SECILI_ADAYLAR','takim_data',
            'RB_SYNC_MATCH','rbSync','manifest','storage().ref',
            'fixtures','fixture','maclar','maçlar','bulten_data','bultenData'
          ]
          for term in terms:
              print('\n===== '+term+' =====')
              ms=list(re.finditer(re.escape(term),s,re.I))
              print('COUNT',len(ms))
              for m in ms[:12]:
                  a=max(0,m.start()-900); b=min(len(s),m.end()+2600)
                  print(re.sub(r'\s+',' ',s[a:b])[:3500])
          PY
