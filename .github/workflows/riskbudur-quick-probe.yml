name: riskbudur quick probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/riskbudur-quick-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and inspect public page
        shell: bash
        run: |
          set -o pipefail
          curl -L --compressed --connect-timeout 10 --max-time 35 -A 'Mozilla/5.0' -sS https://www.riskbuduranaliz.com/ -o /tmp/risk.html
          echo "BYTES $(wc -c < /tmp/risk.html)"
          echo "=== SCRIPT SRCS ==="
          grep -Eo '<script[^>]+src=["'"'"'][^"'"'"']+' /tmp/risk.html | sed -E 's/.*src=["'"'"']//g' | head -100 || true
          echo "=== PUBLIC URLS/FILES ==="
          grep -Eo 'https?://[^"'"'"' <>()]+' /tmp/risk.html | grep -Ei 'firebase|googleapis|firestore|xlsx|csv|json|api|fixture|match|bullet|data' | sort -u | head -250 || true
          echo "=== FILE NAMES ==="
          grep -Eo '[A-Za-z0-9_./?=&%-]+\.(xlsx|xls|csv|json)(\?[^"'"'"' <>()]+)?' /tmp/risk.html | sort -u | head -250 || true
          echo "=== FIREBASE/FETCH CONTEXT ==="
          python - <<'PY'
          import re
          s=open('/tmp/risk.html',encoding='utf-8',errors='replace').read()
          for term in ['firebaseConfig','initializeApp','getFirestore','collection(','getDocs(','onSnapshot(','fetch(','TAKIM_ANAL','bulletin','bulten','Bülten','Tarih Ekle','Maç Ekle']:
              print('\n##',term)
              for m in list(re.finditer(re.escape(term),s,re.I))[:20]:
                  a=max(0,m.start()-220); b=min(len(s),m.end()+500)
                  print(re.sub(r'\s+',' ',s[a:b])[:750])
          PY
