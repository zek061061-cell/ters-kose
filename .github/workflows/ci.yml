name: Ters Kose CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          blocks = [x for x in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S|re.I) if x.strip()]
          Path("/tmp/ters-kose-inline.js").write_text("\n".join(blocks), encoding="utf-8")
          print(f"inline script blocks: {len(blocks)}")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/ters-kose-inline.js
