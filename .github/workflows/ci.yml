name: Ters Kose CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          blocks = [x for x in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S|re.I) if x.strip()]
          Path("/tmp/ters-kose-inline.js").write_text("\n".join(blocks), encoding="utf-8")
          print(f"inline script blocks: {len(blocks)}")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/ters-kose-inline.js
      - name: Check application endpoints
        run: |
          python - <<'PY'
          import os
          import app

          client = app.app.test_client()

          r = client.get("/history/status")
          assert r.status_code in (200, 404), r.status_code

          os.environ.pop("HISTORY_BUILD_TOKEN", None)
          assert client.post("/history/build").status_code == 403
          assert client.post("/history/retry-gaps").status_code == 403

          assert client.get("/fixtures?date=bad").status_code == 400

          for path in ("/", "/manifest.json", "/sw.js"):
              rr = client.get(path)
              assert rr.status_code == 200, (path, rr.status_code)

          print("endpoint smoke tests passed")
          PY
