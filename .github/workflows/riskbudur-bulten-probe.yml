name: riskbudur bulten-flow probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/riskbudur-bulten-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bulten source functions
        shell: bash
        run: |
          curl -L --compressed --connect-timeout 10 --max-time 35 -A 'Mozilla/5.0' -sS https://www.riskbuduranaliz.com/ -o /tmp/risk.html
          python - <<'PY'
          import re
          s=open('/tmp/risk.html',encoding='utf-8',errors='replace').read()
          for term in [
              'function bultenGetDateMatches',
              'function bultenGetSelectedDates',
              'function _loadDataFromFirestore',
              'function _applyCompact',
              'function processWorkbook',
              'function parseExcel',
              'uploadedAt',
              'bulten_daily_data_v2'
          ]:
              print('\n===== '+term+' =====')
              ms=list(re.finditer(re.escape(term),s,re.I))
              print('COUNT',len(ms))
              for m in ms[:8]:
                  a=max(0,m.start()-700); b=min(len(s),m.end()+4200)
                  print(re.sub(r'\s+',' ',s[a:b])[:4900])
          PY
