name: riskbudur public-source probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/riskbudur-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Riskbudur client source
        run: |
          python - <<'PY'
          import re, urllib.request
          url="https://www.riskbuduranaliz.com/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode("utf-8","replace")
          print("STATUS OK BYTES",len(html.encode()))
          print("SCRIPT_SRCS")
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              print(s)
          patterns=[
              r'https://[^"\'<> ]+',
              r'firebase[^"\'<> ]*',
              r'firestore[^"\'<> ]*',
              r'fetch\([^\n]{0,220}',
              r'axios[^\n]{0,220}',
              r'[^"\']+\.(?:xlsx|xls|csv|json)(?:\?[^"\']*)?',
              r'collection\([^\n]{0,180}',
              r'getDocs\([^\n]{0,180}',
              r'getDoc\([^\n]{0,180}',
              r'onSnapshot\([^\n]{0,180}',
          ]
          seen=set()
          print("MATCHES")
          for pat in patterns:
              for m in re.finditer(pat,html,re.I):
                  text=m.group(0).strip()
                  if text in seen: continue
                  seen.add(text)
                  print(text[:500])
          # Print compact contexts for bulletin/data-update terms
          for term in ["Bülten","TAKIM_ANALİZ","Firestore","Firebase","Tarih Ekle","Maç Ekle","Güncel Veriyi Çek"]:
              print("CONTEXT",term)
              for m in list(re.finditer(re.escape(term),html,re.I))[:8]:
                  a=max(0,m.start()-350); b=min(len(html),m.end()+700)
                  print(re.sub(r"\s+"," ",html[a:b])[:1100])
          PY
