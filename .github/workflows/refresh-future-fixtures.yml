name: Refresh future fixtures

on:
  push:
    branches: [main]
    paths:
      - 'build_future_fixtures.py'
      - '.github/workflows/refresh-future-fixtures.yml'
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build_future_fixtures.py
      - name: Commit future fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/future_fixtures.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh future season fixtures"
            git pull --rebase origin main
            git push origin main
          fi
