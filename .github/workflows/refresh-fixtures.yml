name: Refresh current fixtures

on:
  push:
    branches: [main]
    paths:
      - 'build_current_fixtures.py'
      - '.github/workflows/refresh-fixtures.yml'
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ters-kose-fixtures
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build_current_fixtures.py
      - run: python build_bulletin_archive.py
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_fixtures.json data/bulletin_1y.json
          if git diff --cached --quiet; then
            echo "No fixture changes"
          else
            git commit -m "Refresh current fixtures"
            git pull --rebase origin main
            git push origin main
          fi
