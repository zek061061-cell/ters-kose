name: v7 source diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v7-source-diagnostics.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Football-Data
        run: |
          python - <<'PY'
          import requests
          urls=[
            "https://www.football-data.co.uk/matches/resources/fixtures.csv",
            "https://www.football-data.co.uk/mmz4281/2627/E0.csv",
            "https://www.football-data.co.uk/mmz4281/2526/E0.csv",
          ]
          for url in urls:
              try:
                  r=requests.get(url,timeout=30,headers={"User-Agent":"Mozilla/5.0","Accept":"text/csv,*/*"})
                  print("URL",url)
                  print("STATUS",r.status_code,"TYPE",r.headers.get("content-type"),"LEN",len(r.content))
                  print("HEAD",repr(r.text[:300]))
              except Exception as e:
                  print("URL",url,"ERROR",repr(e))
          PY
